server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript video/mp4;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, CSS, JS, videos)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|webm|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fallback error page
    error_page 404 /index.html;
}
