apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webnora-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webnora-service
            port:
              number: 80
